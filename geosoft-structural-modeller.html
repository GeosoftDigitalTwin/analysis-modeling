<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GeoSoft Structural Modeller</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0F1211; --chrome: #1B1D1F; --ribbon: #202423; --surface: #161B18; --surface-2: #1E2621; --line: #2B3730;
  --text: #F1F5F2; --muted: #9BAAA1; --accent: #3BE08F; --accent-ink: #062414; --sel: #FFD24D;
  --ok: #2FBF71; --est: #F2B53A; --bad: #EF5350; --link: #8A9A92; --node: #DDE6E0; --beam: #7FB4FF; --plate: #4FC9D8; --solid: #A394FF; --sup: #3BE08F; --grid: #26302B; --vp1: #1E2621; --vp2: #121614;
  --font: "Inter", "Segoe UI", system-ui, sans-serif; --head: "Inter Tight", "Inter", system-ui, sans-serif; --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); color-scheme: dark;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --bg: #EEF2EF; --chrome: #1B1D1F; --ribbon: #F7FAF8; --surface: #FFFFFF; --surface-2: #EAF0EC; --line: #C9D6CD; --text: #121614; --muted: #55665B; --accent: #14A85F; --accent-ink: #FFFFFF; --sel: #D97706; --ok: #1E9A57; --est: #B97F0B; --bad: #CC2F2C; --link: #61736A; --node: #1F2A24; --beam: #1D4ED8; --plate: #0E7490; --solid: #6D28D9; --sup: #15803D; --grid: #D8E2DB; --vp1: #FFFFFF; --vp2: #E7EEE9; color-scheme: light; } }
:root[data-theme="light"] { --bg: #EEF2EF; --chrome: #1B1D1F; --ribbon: #F7FAF8; --surface: #FFFFFF; --surface-2: #EAF0EC; --line: #C9D6CD; --text: #121614; --muted: #55665B; --accent: #14A85F; --accent-ink: #FFFFFF; --sel: #D97706; --ok: #1E9A57; --est: #B97F0B; --bad: #CC2F2C; --link: #61736A; --node: #1F2A24; --beam: #1D4ED8; --plate: #0E7490; --solid: #6D28D9; --sup: #15803D; --grid: #D8E2DB; --vp1: #FFFFFF; --vp2: #E7EEE9; color-scheme: light; }
:root[data-theme="dark"] { color-scheme: dark; }
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.4 var(--font); -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.mono, td.n { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* title bar */
.titlebar { display: flex; align-items: center; gap: 12px; padding: 6px 12px; background: var(--chrome); color: #F1F5F2; border-bottom: 1px solid #2A2E2D; flex: none; }
.titlebar svg.logo { width: 34px; height: 24px; }
.titlebar b { font: 500 1.05rem var(--head); }
.titlebar .doc { color: #9BAAA1; font-size: 0.82rem; margin-left: 6px; }
.titlebar .sp { flex: 1; }
.tb-btn { background: transparent; border: 1px solid #3A4140; color: #F1F5F2; border-radius: 6px; padding: 4px 9px; cursor: pointer; font-size: 0.8rem; }
.tb-btn:disabled { opacity: 0.4; cursor: default; }

/* ribbon */
.rtabs { display: flex; gap: 1px; background: var(--chrome); padding: 0 8px; flex: none; overflow-x: auto; }
.rtabs button { background: none; border: 0; color: #9BAAA1; padding: 7px 13px; cursor: pointer; font-weight: 500; border-radius: 6px 6px 0 0; white-space: nowrap; }
.rtabs button[aria-selected=true] { background: var(--ribbon); color: var(--text); }
.rtabs button:disabled { opacity: 0.45; cursor: default; }
.ribbon { background: var(--ribbon); border-bottom: 1px solid var(--line); display: flex; gap: 0; padding: 4px 6px 0; overflow-x: auto; flex: none; min-height: 92px; }
.rgroup { display: flex; flex-direction: column; border-right: 1px solid var(--line); padding: 0 6px; flex: none; }
.rgroup .cmds { display: flex; gap: 2px; align-items: flex-start; flex: 1; }
.rgroup .glabel { text-align: center; color: var(--muted); font-size: 0.7rem; padding: 2px 0 4px; }
.rbtn { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 50px; max-width: 74px; padding: 4px 4px 3px; border: 1px solid transparent; border-radius: 6px; background: none; cursor: pointer; font-size: 0.7rem; line-height: 1.15; text-align: center; color: var(--text); }
.rbtn svg { width: 24px; height: 24px; flex: none; }
.rbtn:hover { background: var(--surface-2); border-color: var(--line); }
.rbtn.on { background: color-mix(in srgb, var(--accent) 18%, transparent); border-color: var(--accent); }
.rbtn:disabled { opacity: 0.4; cursor: default; }
.rstack { display: flex; flex-direction: column; gap: 3px; padding-top: 2px; }
.rstack label { display: flex; gap: 6px; align-items: center; font-size: 0.74rem; color: var(--muted); white-space: nowrap; }
.rstack input[type=number], .rstack select { width: 76px; padding: 2px 5px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); font-family: var(--mono); font-size: 0.74rem; }
.rstack input[type=checkbox] { accent-color: var(--accent); }

/* workspace */
.work { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 360px; min-height: 0; }
.vp { position: relative; background: radial-gradient(ellipse at 50% 40%, var(--vp1), var(--vp2) 80%); min-width: 0; }
canvas#cv { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
.vp .tooltip { position: absolute; left: 10px; top: 10px; background: color-mix(in srgb, var(--surface) 90%, transparent); border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px; font-size: 0.78rem; max-width: 70%; pointer-events: none; }
.vp .tooltip b { color: var(--accent); }
.vp .empty { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: var(--muted); pointer-events: none; }
.vp .empty[hidden] { display: none; }
.vp .empty b { display: block; color: var(--text); font: 600 1.1rem var(--head); }
.vcube { position: absolute; right: 10px; top: 10px; display: grid; grid-template-columns: repeat(3, 30px); gap: 2px; }
.vcube button { height: 24px; border: 1px solid var(--line); background: color-mix(in srgb, var(--surface) 92%, transparent); border-radius: 4px; cursor: pointer; font-size: 0.66rem; color: var(--muted); }
.vcube button:hover { color: var(--text); border-color: var(--accent); }

.side { background: var(--surface); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.ptabs { display: flex; flex-wrap: wrap; gap: 1px; border-bottom: 1px solid var(--line); padding: 4px 4px 0; flex: none; }
.ptabs button { background: none; border: 0; padding: 6px 8px; cursor: pointer; color: var(--muted); font-size: 0.76rem; border-bottom: 2px solid transparent; }
.ptabs button[aria-selected=true] { color: var(--text); border-bottom-color: var(--accent); }
.pbody { flex: 1; overflow: auto; padding: 10px; min-height: 0; }
.pbody h3 { font: 600 0.9rem var(--head); margin: 4px 0 8px; }
.pbody .muted { color: var(--muted); }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 10px; margin: 6px 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }
.kv input, .kv select { width: 100%; padding: 2px 5px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface-2); font-family: var(--mono); font-size: 0.78rem; }
.tblw { border: 1px solid var(--line); border-radius: 6px; overflow: auto; max-height: 100%; }
table { border-collapse: collapse; width: 100%; font-size: 0.76rem; }
th { position: sticky; top: 0; background: var(--surface-2); color: var(--muted); text-align: left; padding: 4px 6px; font-weight: 600; z-index: 1; white-space: nowrap; }
td { padding: 3px 6px; border-top: 1px solid color-mix(in srgb, var(--line) 60%, transparent); white-space: nowrap; }
td input { width: 74px; padding: 1px 4px; border: 1px solid transparent; background: transparent; font-family: var(--mono); font-size: 0.76rem; border-radius: 3px; }
td input:focus { border-color: var(--accent); background: var(--surface-2); }
tr.is-sel td { background: color-mix(in srgb, var(--sel) 18%, transparent); }
tbody tr { cursor: pointer; }
.btn { padding: 5px 10px; border-radius: 5px; border: 1px solid var(--line); background: var(--surface-2); cursor: pointer; font-size: 0.78rem; }
.btn:hover { border-color: var(--accent); }
.btn.pri { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 6px 0; }
.chip { display: inline-block; padding: 1px 7px; border-radius: 99px; font-size: 0.7rem; font-weight: 600; }
.chip.ok { background: var(--ok); color: #03200f; } .chip.bad { color: var(--bad); border: 1px solid var(--bad); } .chip.est { background: var(--est); color: #2a1a00; }
textarea.input { width: 100%; height: calc(100% - 40px); min-height: 300px; font: 0.74rem/1.45 var(--mono); background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 8px; resize: none; white-space: pre; }

.status { flex: none; display: flex; gap: 16px; align-items: center; padding: 3px 12px; background: var(--chrome); color: #9BAAA1; font-size: 0.74rem; border-top: 1px solid #2A2E2D; overflow-x: auto; white-space: nowrap; }
.status b { color: #F1F5F2; font-weight: 600; }

/* dialogs */
dialog { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--text); padding: 0; max-width: min(960px, 96vw); width: max-content; min-width: 340px; box-shadow: 0 20px 60px rgba(0,0,0,.4); }
dialog::backdrop { background: rgba(0,0,0,.45); }
dialog header { padding: 10px 14px; border-bottom: 1px solid var(--line); font: 600 1rem var(--head); display: flex; justify-content: space-between; }
dialog .dbody { padding: 12px 14px; max-height: 70vh; overflow: auto; }
dialog footer { padding: 10px 14px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 8px; }
.form { display: grid; grid-template-columns: max-content 140px; gap: 6px 12px; align-items: center; }
.form label { color: var(--muted); }
.form input, .form select { padding: 4px 6px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface-2); font-family: var(--mono); }
.lib { display: grid; grid-template-columns: 190px 300px 300px; gap: 10px; height: 460px; }
.lib .col { border: 1px solid var(--line); border-radius: 6px; overflow: auto; }
.lib .item { padding: 5px 9px; cursor: pointer; border-bottom: 1px solid color-mix(in srgb, var(--line) 50%, transparent); }
.lib .item:hover { background: var(--surface-2); }
.lib .item.on { background: color-mix(in srgb, var(--accent) 18%, transparent); }
.lib .item small { color: var(--muted); }
.relgrid { display: grid; grid-template-columns: 70px repeat(6, 44px); gap: 4px; align-items: center; text-align: center; }
.relgrid b { font-size: 0.74rem; color: var(--muted); }
.relgrid input { accent-color: var(--accent); }
.note { color: var(--muted); font-size: 0.76rem; margin: 8px 0 0; max-width: 72ch; }
@media (max-width: 900px) { .work { grid-template-columns: 1fr; grid-template-rows: minmax(300px, 1fr) 300px; } .side { border-left: 0; border-top: 1px solid var(--line); } .lib { grid-template-columns: 1fr; height: auto; } }
</style>
</head>
<body>
<header class="titlebar">
  <svg class="logo" viewBox="0 0 64 44" aria-hidden="true"><circle cx="23" cy="22" r="13" fill="none" stroke="#3BE08F" stroke-width="7"/><path d="M41 9a13 13 0 1 1-12.6 16.2" fill="none" stroke="#7FF2BC" stroke-width="7" stroke-linecap="round"/></svg>
  <b>GeoSoft Structural Modeller</b><span class="doc" id="docName">Untitled model</span>
  <span class="sp"></span>
  <button class="tb-btn" id="undoBtn" type="button" title="Undo (Ctrl+Z)" disabled>↶ Undo</button>
  <button class="tb-btn" id="redoBtn" type="button" title="Redo (Ctrl+Y)" disabled>↷ Redo</button>
  <button class="tb-btn" id="themeBtn" type="button" aria-label="Switch theme">◐</button>
</header>
<nav class="rtabs" id="rtabs" role="tablist" aria-label="Ribbon"></nav>
<div class="ribbon" id="ribbon"></div>
<div class="work">
  <div class="vp" id="vp">
    <canvas id="cv" aria-label="Model viewport. Left-click selects or places, left-drag window-selects, right-drag rotates, middle-drag or Shift+right-drag pans, wheel zooms."></canvas>
    <div class="empty" id="empty"><div><b>Start a model</b>Import IFC, SACS or STAAD from the File tab, open a sample, or add nodes and beams from the Geometry tab.</div></div>
    <div class="tooltip" id="tip" hidden></div>
    <div class="vcube" id="vcube">
      <button data-v="top" type="button">Top</button><button data-v="back" type="button">Back</button><button data-v="iso" type="button">Iso</button>
      <button data-v="left" type="button">Left</button><button data-v="front" type="button">Front</button><button data-v="right" type="button">Right</button>
      <button data-v="bottom" type="button">Bot</button><button data-v="fit" type="button">Fit</button><button data-v="zsel" type="button">Sel</button>
    </div>
  </div>
  <aside class="side">
    <div class="ptabs" id="ptabs" role="tablist"></div>
    <div class="pbody" id="pbody"></div>
  </aside>
</div>
<footer class="status" id="status"></footer>
<dialog id="dlg"><header><span id="dlgTitle"></span><button class="tb-btn" id="dlgX" type="button" style="color:var(--muted);border-color:var(--line)">×</button></header><div class="dbody" id="dlgBody"></div><footer id="dlgFoot"></footer></dialog>
<input type="file" id="fileIn" hidden accept=".ifc,.inp,.sacs,.txt,.std,.obj,.json,.csv">
<script>
/* GeoSoft Structural Importer — core, part 1: IFC (ISO 10303-21 / STEP) reader
   No external libraries. Reads IFC2X3, IFC4, IFC4X1–4X3 text files. */
(function (G) {
  'use strict';

  /* ---------------- STEP physical file: lazy record index ---------------- */
  function indexStep(text) {
    const sm = text.match(/FILE_SCHEMA\s*\(\s*\(\s*'([^']+)'/i);
    const schema = sm ? sm[1].toUpperCase() : 'UNKNOWN';
    const dm = /\bDATA\s*;/i.exec(text);
    if (!dm) throw new Error('This is not an IFC STEP file (no DATA section). IFC-XML and IFC-ZIP are not supported yet: export as .ifc (STEP).');
    let i = dm.index + dm[0].length;
    const n = text.length;
    const recs = new Map();
    const byType = new Map();
    while (i < n) {
      let c = text.charCodeAt(i);
      // skip whitespace
      if (c <= 32) { i++; continue; }
      // comments
      if (c === 47 && text.charCodeAt(i + 1) === 42) { const e = text.indexOf('*/', i + 2); i = e < 0 ? n : e + 2; continue; }
      if (c === 69 /* E */ && text.startsWith('ENDSEC', i)) break;
      if (c !== 35 /* # */) { const e = text.indexOf(';', i); i = e < 0 ? n : e + 1; continue; }
      // #id
      let j = i + 1, id = 0;
      while (j < n) { const d = text.charCodeAt(j); if (d >= 48 && d <= 57) { id = id * 10 + (d - 48); j++; } else break; }
      while (j < n && text.charCodeAt(j) <= 32) j++;
      if (text.charCodeAt(j) !== 61 /* = */) { const e = text.indexOf(';', j); i = e < 0 ? n : e + 1; continue; }
      j++;
      while (j < n && text.charCodeAt(j) <= 32) j++;
      // type name
      const ts = j;
      while (j < n) { const d = text.charCodeAt(j); if ((d >= 65 && d <= 90) || (d >= 48 && d <= 57) || d === 95 || (d >= 97 && d <= 122)) j++; else break; }
      const type = text.slice(ts, j).toUpperCase();
      while (j < n && text.charCodeAt(j) <= 32) j++;
      const argStart = j; // at '('
      // find record end ';' outside strings
      let k = j, inStr = false;
      while (k < n) {
        const d = text.charCodeAt(k);
        if (inStr) { if (d === 39) { if (text.charCodeAt(k + 1) === 39) { k += 2; continue; } inStr = false; } k++; continue; }
        if (d === 39) { inStr = true; k++; continue; }
        if (d === 59) break;
        k++;
      }
      recs.set(id, { t: type, s: argStart, e: k, a: null });
      let arr = byType.get(type); if (!arr) { arr = []; byType.set(type, arr); } arr.push(id);
      i = k + 1;
    }
    return { text, schema, recs, byType };
  }

  // parse one argument list starting at text[pos] === '('
  function parseArgs(text, pos) {
    let i = pos;
    const n = text.length;
    function ws() { while (i < n && text.charCodeAt(i) <= 32) i++; }
    function val() {
      ws();
      const c = text.charCodeAt(i);
      if (c === 35) { // #ref
        i++; let v = 0; while (i < n) { const d = text.charCodeAt(i); if (d >= 48 && d <= 57) { v = v * 10 + (d - 48); i++; } else break; }
        return { r: v };
      }
      if (c === 39) { // string
        i++; let s = '';
        while (i < n) {
          const d = text.charCodeAt(i);
          if (d === 39) { if (text.charCodeAt(i + 1) === 39) { s += "'"; i += 2; continue; } i++; break; }
          s += text[i]; i++;
        }
        return decodeStr(s);
      }
      if (c === 36) { i++; return null; } // $
      if (c === 42) { i++; return '*'; } // *
      if (c === 46) { // .ENUM.
        const e = text.indexOf('.', i + 1); const v = text.slice(i + 1, e); i = e + 1;
        return { e: v.toUpperCase() };
      }
      if (c === 40) return list();
      if (c === 34) { const e = text.indexOf('"', i + 1); i = e + 1; return null; } // binary
      if ((c >= 65 && c <= 90) || (c >= 97 && c <= 122)) { // typed value IFCLABEL(...)
        const s = i; while (i < n && text[i] !== '(') i++;
        const tname = text.slice(s, i).toUpperCase();
        const inner = list();
        const v = inner.length === 1 ? inner[0] : inner;
        return (v && typeof v === 'object' && !Array.isArray(v)) ? v : { tv: tname, v };
      }
      // number
      const s = i;
      while (i < n) { const d = text.charCodeAt(i); if ((d >= 48 && d <= 57) || d === 43 || d === 45 || d === 46 || d === 69 || d === 101) i++; else break; }
      return parseFloat(text.slice(s, i));
    }
    function list() {
      // assumes text[i] === '('
      i++; const out = [];
      ws();
      if (text[i] === ')') { i++; return out; }
      while (i < n) {
        out.push(val()); ws();
        const c = text[i];
        if (c === ',') { i++; continue; }
        if (c === ')') { i++; break; }
        i++; // tolerate garbage
      }
      return out;
    }
    return list();
  }

  function decodeStr(s) {
    if (s.indexOf('\\') < 0) return s;
    return s
      .replace(/\\X2\\([0-9A-F]+)\\X0\\/gi, (m, h) => { let o = ''; for (let k = 0; k + 4 <= h.length; k += 4) o += String.fromCharCode(parseInt(h.substr(k, 4), 16)); return o; })
      .replace(/\\X\\([0-9A-F]{2})/gi, (m, h) => String.fromCharCode(parseInt(h, 16)))
      .replace(/\\S\\(.)/g, (m, ch) => String.fromCharCode(ch.charCodeAt(0) + 128))
      .replace(/\\\\/g, '\\');
  }

  function makeDb(text) {
    const idx = indexStep(text);
    const db = {
      schema: idx.schema, byType: idx.byType, count: idx.recs.size,
      get(id) {
        if (id == null) return null;
        if (typeof id === 'object') { if (id.r == null) return null; id = id.r; }
        const r = idx.recs.get(id);
        if (!r) return null;
        if (!r.a) r.a = parseArgs(idx.text, r.s);
        return { id, t: r.t, a: r.a };
      },
      type(id) { const r = idx.recs.get(typeof id === 'object' ? id.r : id); return r ? r.t : null; },
      ids(prefix) { const out = []; for (const [t, arr] of idx.byType) if (t === prefix || (prefix.endsWith('*') && t.startsWith(prefix.slice(0, -1)))) out.push(...arr); return out; }
    };
    return db;
  }

  /* ---------------- small 3D math ---------------- */
  const V = {
    add: (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]],
    sub: (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]],
    mul: (a, s) => [a[0] * s, a[1] * s, a[2] * s],
    dot: (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2],
    cross: (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]],
    len: a => Math.hypot(a[0], a[1], a[2]),
    norm: a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; }
  };
  // affine matrix: {x:[..], y:[..], z:[..], o:[..]} columns
  const I3 = () => ({ x: [1, 0, 0], y: [0, 1, 0], z: [0, 0, 1], o: [0, 0, 0] });
  const mApply = (M, p) => [M.o[0] + M.x[0] * p[0] + M.y[0] * p[1] + M.z[0] * p[2], M.o[1] + M.x[1] * p[0] + M.y[1] * p[1] + M.z[1] * p[2], M.o[2] + M.x[2] * p[0] + M.y[2] * p[1] + M.z[2] * p[2]];
  const mDir = (M, v) => [M.x[0] * v[0] + M.y[0] * v[1] + M.z[0] * v[2], M.x[1] * v[0] + M.y[1] * v[1] + M.z[1] * v[2], M.x[2] * v[0] + M.y[2] * v[1] + M.z[2] * v[2]];
  const mMul = (A, B) => ({ x: mDir(A, B.x), y: mDir(A, B.y), z: mDir(A, B.z), o: mApply(A, B.o) });

  /* ---------------- IFC reader ---------------- */
  const LINEAR = /^IFC(BEAM|COLUMN|MEMBER|PILE)(STANDARDCASE|ELEMENTEDCASE)?$/;
  const PLANAR = /^IFC(PLATE|SLAB)(STANDARDCASE|ELEMENTEDCASE)?$/;
  const STRUCT_CURVE = /^IFCSTRUCTURAL(CURVE)MEMBER(VARYING)?$/;
  const STRUCT_SURF = /^IFCSTRUCTURALSURFACEMEMBER(VARYING)?$/;

  function readIfc(text, opts = {}) {
    const t0 = Date.now();
    const db = makeDb(text);
    const issues = [];
    const issue = (sev, code, msg, ref) => issues.push({ sev, code, msg, ref });

    // ---- units: the project's IfcUnitAssignment decides ----
    let scale = 1, unitName = 'METRE';
    const PRE = { EXA: 1e18, PETA: 1e15, TERA: 1e12, GIGA: 1e9, MEGA: 1e6, KILO: 1e3, HECTO: 100, DECA: 10, DECI: 0.1, CENTI: 0.01, MILLI: 1e-3, MICRO: 1e-6, NANO: 1e-9 };
    function lengthUnitScale(uref, depth = 0) {
      const u = db.get(uref); if (!u || depth > 4) return null;
      if (u.t === 'IFCSIUNIT') { const pre = u.a[2] && u.a[2].e; return { s: pre ? PRE[pre] || 1 : 1, n: (pre ? pre + ' ' : '') + 'METRE' }; }
      if (u.t === 'IFCCONVERSIONBASEDUNIT' || u.t === 'IFCCONVERSIONBASEDUNITWITHOFFSET') {
        const mw = db.get(u.a[3]); // IfcMeasureWithUnit(ValueComponent, UnitComponent)
        let s = null;
        if (mw) { const v = typeof mw.a[0] === 'number' ? mw.a[0] : (mw.a[0] && typeof mw.a[0].v === 'number' ? mw.a[0].v : null); const base = lengthUnitScale(mw.a[1], depth + 1); if (v != null) s = v * (base ? base.s : 1); }
        const nm = String(u.a[2] || '').toUpperCase();
        if (!s) s = nm.includes('FOOT') ? 0.3048 : nm.includes('INCH') ? 0.0254 : 1;
        return { s, n: nm || 'CONVERSION UNIT' };
      }
      return null;
    }
    let unitFound = false;
    const projId = (db.ids('IFCPROJECT')[0]) || (db.ids('IFCPROJECTLIBRARY')[0]);
    if (projId) {
      const ua = db.get(db.get(projId).a[8]);
      if (ua) for (const ur of ua.a[0] || []) { const u = db.get(ur); if (u && u.a[1] && u.a[1].e === 'LENGTHUNIT') { const r = lengthUnitScale(ur); if (r) { scale = r.s; unitName = r.n; unitFound = true; } } }
    }
    if (!unitFound) {
      for (const id of db.ids('IFCSIUNIT')) { const u = db.get(id).a; if (u[1] && u[1].e === 'LENGTHUNIT') { const r = lengthUnitScale({ r: id }); scale = r.s; unitName = r.n; break; } }
      issue('warn', 'UNITS', `No project unit assignment found; length unit taken as ${unitName}. Check dimensions.`, null);
    }

    const P = v => { // cartesian point
      const e = db.get(v); if (!e) return [0, 0, 0];
      const c = e.a[0] || [];
      return [(c[0] || 0) * scale, (c[1] || 0) * scale, (c[2] || 0) * scale];
    };
    const D = v => { const e = db.get(v); if (!e) return null; const c = e.a[0] || []; return V.norm([c[0] || 0, c[1] || 0, c[2] || 0]); };

    function axisPlacement(ref) {
      const e = db.get(ref); if (!e) return I3();
      if (e.t === 'IFCAXIS2PLACEMENT3D') {
        const o = P(e.a[0]);
        const z = e.a[1] ? D(e.a[1]) : [0, 0, 1];
        let x = e.a[2] ? D(e.a[2]) : (Math.abs(z[2]) < 0.999 ? [1, 0, 0] : [1, 0, 0]);
        // orthogonalise x against z
        x = V.sub(x, V.mul(z, V.dot(x, z)));
        if (V.len(x) < 1e-9) x = Math.abs(z[0]) < 0.9 ? V.sub([1, 0, 0], V.mul(z, z[0])) : V.sub([0, 1, 0], V.mul(z, z[1]));
        x = V.norm(x);
        return { x, y: V.cross(z, x), z, o };
      }
      if (e.t === 'IFCAXIS2PLACEMENT2D') {
        const o = P(e.a[0]); let x = e.a[1] ? D(e.a[1]) : [1, 0, 0];
        x = V.norm([x[0], x[1], 0]);
        return { x, y: [-x[1], x[0], 0], z: [0, 0, 1], o };
      }
      return I3();
    }
    const placementMemo = new Map();
    function objectPlacement(ref, depth = 0) {
      if (ref == null || depth > 64) return I3();
      const key = ref.r;
      if (placementMemo.has(key)) return placementMemo.get(key);
      const e = db.get(ref); let M = I3();
      if (e && e.t === 'IFCLOCALPLACEMENT') {
        const parent = e.a[0] ? objectPlacement(e.a[0], depth + 1) : I3();
        M = mMul(parent, axisPlacement(e.a[1]));
      } else if (e && e.t === 'IFCLINEARPLACEMENT') {
        issue('warn', 'PLACEMENT', 'Linear (alignment-based) placement found; treated as origin. Infrastructure alignments are not supported yet.', key);
      } else if (e && e.t === 'IFCGRIDPLACEMENT') {
        issue('warn', 'PLACEMENT', 'Grid placement found; treated as origin.', key);
      }
      placementMemo.set(key, M);
      return M;
    }
    function cartesianOperator(ref) {
      const e = db.get(ref); if (!e) return I3();
      // Axis1, Axis2, LocalOrigin, Scale, (Axis3, Scale2, Scale3)
      const o = P(e.a[2]);
      const s = (typeof e.a[3] === 'number') ? e.a[3] : 1;
      const z = e.a[4] ? D(e.a[4]) : [0, 0, 1];
      let x = e.a[0] ? D(e.a[0]) : [1, 0, 0];
      x = V.norm(V.sub(x, V.mul(z, V.dot(x, z))));
      const y = V.cross(z, x);
      return { x: V.mul(x, s), y: V.mul(y, s), z: V.mul(z, s), o };
    }

    /* ---- profiles → section definition (dimensions in m) ---- */
    const profileMemo = new Map();
    function profileDef(ref) {
      if (!ref) return null;
      if (profileMemo.has(ref.r)) return profileMemo.get(ref.r);
      const e = db.get(ref); let p = null;
      if (!e) return null;
      const a = e.a, L = v => (typeof v === 'number' ? v * scale : null);
      const nm = typeof a[1] === 'string' ? a[1] : '';
      const pos = a[2] ? axisPlacement(a[2]) : null;
      const off = pos ? [pos.o[0], pos.o[1]] : [0, 0];
      switch (e.t) {
        case 'IFCISHAPEPROFILEDEF': p = { shape: 'I', b: L(a[3]), h: L(a[4]), tw: L(a[5]), tf: L(a[6]) }; break;
        case 'IFCASYMMETRICISHAPEPROFILEDEF': p = { shape: 'I', b: L(a[3]), h: L(a[4]), tw: L(a[5]), tf: L(a[6]), note: 'asymmetric I treated as symmetric (top flange)' }; break;
        case 'IFCCIRCLEHOLLOWPROFILEDEF': p = { shape: 'CHS', D: 2 * L(a[3]), t: L(a[4]) }; break;
        case 'IFCCIRCLEPROFILEDEF': p = { shape: 'CIRC', D: 2 * L(a[3]) }; break;
        case 'IFCRECTANGLEPROFILEDEF': p = { shape: 'RECT', b: L(a[3]), h: L(a[4]) }; break;
        case 'IFCRECTANGLEHOLLOWPROFILEDEF': p = { shape: 'RHS', b: L(a[3]), h: L(a[4]), t: L(a[5]) }; break;
        case 'IFCROUNDEDRECTANGLEPROFILEDEF': p = { shape: 'RECT', b: L(a[3]), h: L(a[4]), note: 'corner radii ignored' }; break;
        case 'IFCLSHAPEPROFILEDEF': p = { shape: 'L', h: L(a[3]), b: L(a[4]) || L(a[3]), t: L(a[5]) }; break;
        case 'IFCUSHAPEPROFILEDEF': p = { shape: 'U', h: L(a[3]), b: L(a[4]), tw: L(a[5]), tf: L(a[6]) }; break;
        case 'IFCCSHAPEPROFILEDEF': p = { shape: 'C', h: L(a[3]), b: L(a[4]), t: L(a[5]), girth: L(a[6]) }; break;
        case 'IFCTSHAPEPROFILEDEF': p = { shape: 'T', h: L(a[3]), b: L(a[4]), tw: L(a[5]), tf: L(a[6]) }; break;
        case 'IFCZSHAPEPROFILEDEF': p = { shape: 'Z', h: L(a[3]), b: L(a[4]), tw: L(a[5]), tf: L(a[6]) }; break;
        case 'IFCELLIPSEPROFILEDEF': p = { shape: 'POLY', loops: [ellipse(L(a[3]), L(a[4]))], note: 'ellipse' }; break;
        case 'IFCARBITRARYCLOSEDPROFILEDEF': { const lp = curvePoints2D(a[2]); p = lp ? { shape: 'POLY', loops: [lp] } : null; break; }
        case 'IFCARBITRARYPROFILEDEFWITHVOIDS': {
          const outer = curvePoints2D(a[2]); const inner = (a[3] || []).map(curvePoints2D).filter(Boolean);
          p = outer ? { shape: 'POLY', loops: [outer, ...inner] } : null; break;
        }
        case 'IFCDERIVEDPROFILEDEF': { // ParentProfile, Operator, Label
          const base = profileDef(a[2]); p = base ? Object.assign({}, base, { note: (base.note ? base.note + '; ' : '') + 'derived profile transform ignored' }) : null; break;
        }
        case 'IFCCOMPOSITEPROFILEDEF': {
          const parts = (a[2] || []).map(profileDef).filter(Boolean);
          p = parts.length ? { shape: 'COMPOSITE', parts } : null; break;
        }
        default: p = null; issue('info', 'PROFILE', `Profile type ${e.t} is not supported; section marked insufficient.`, ref.r);
      }
      if (p) { p.name = nm || (e.t.replace('IFC', '').replace('PROFILEDEF', '')); p.ifc = e.t; p.offset = off; }
      profileMemo.set(ref.r, p);
      return p;
    }
    function ellipse(a, b) { const pts = []; for (let k = 0; k < 48; k++) { const t = k / 48 * 2 * Math.PI; pts.push([a * Math.cos(t), b * Math.sin(t)]); } return pts; }
    function curvePoints2D(ref) {
      const e = db.get(ref); if (!e) return null;
      if (e.t === 'IFCPOLYLINE') return (e.a[0] || []).map(r => { const q = P(r); return [q[0], q[1]]; });
      if (e.t === 'IFCINDEXEDPOLYCURVE') { const pl = db.get(e.a[0]); return pl ? (pl.a[0] || []).map(c => [c[0] * scale, c[1] * scale]) : null; }
      if (e.t === 'IFCCOMPOSITECURVE') {
        const out = [];
        for (const seg of e.a[0] || []) { const s = db.get(seg); if (!s) continue; const pts = curvePoints2D(s.a[2]); if (pts) out.push(...pts); }
        return out.length ? out : null;
      }
      if (e.t === 'IFCTRIMMEDCURVE') return curvePoints2D(e.a[0]);
      if (e.t === 'IFCCIRCLE') { const pl = axisPlacement(e.a[0]); const r = e.a[1] * scale; return ellipse(r, r).map(q => [q[0] + pl.o[0], q[1] + pl.o[1]]); }
      return null;
    }

    /* ---- materials ---- */
    const matOf = new Map(); // product id -> {name, profile, layerT, props}
    const typeOf = new Map();
    for (const id of db.ids('IFCRELDEFINESBYTYPE')) { const a = db.get(id).a; for (const o of a[4] || []) typeOf.set(o.r, a[5] && a[5].r); }
    function resolveMaterial(ref) {
      const e = db.get(ref); if (!e) return null;
      switch (e.t) {
        case 'IFCMATERIAL': return { name: e.a[0] || 'unnamed', mid: e.id };
        case 'IFCMATERIALPROFILESETUSAGE': case 'IFCMATERIALPROFILESETUSAGETAPERING': return resolveMaterial(e.a[0]);
        case 'IFCMATERIALPROFILESET': { const mp = (e.a[2] || [])[0]; return mp ? resolveMaterial(mp) : null; }
        case 'IFCMATERIALPROFILE': { const m = e.a[2] ? resolveMaterial(e.a[2]) : { name: 'unnamed' }; if (m) m.profileRef = e.a[3]; return m; }
        case 'IFCMATERIALLAYERSETUSAGE': return resolveMaterial(e.a[0]);
        case 'IFCMATERIALLAYERSET': {
          const layers = (e.a[0] || []).map(r => db.get(r)).filter(Boolean);
          const t = layers.reduce((s, l) => s + (l.a[1] || 0) * scale, 0);
          const m = layers[0] && layers[0].a[0] ? resolveMaterial(layers[0].a[0]) : { name: e.a[1] || 'unnamed' };
          if (m) m.layerT = t; return m;
        }
        case 'IFCMATERIALLIST': { const f = (e.a[0] || [])[0]; return f ? resolveMaterial(f) : null; }
        case 'IFCMATERIALCONSTITUENTSET': { const c = (e.a[2] || [])[0]; const ce = c && db.get(c); return ce ? resolveMaterial(ce.a[2]) : null; }
        default: return null;
      }
    }
    for (const id of db.ids('IFCRELASSOCIATESMATERIAL')) {
      const a = db.get(id).a; const m = resolveMaterial(a[5]);
      if (m) for (const o of a[4] || []) matOf.set(o.r, m);
    }
    // material mechanical properties (IFC4 IfcMaterialProperties / IFC2x3 IfcMechanicalSteelMaterialProperties)
    const matProps = new Map();
    for (const id of db.ids('IFCMATERIALPROPERTIES')) {
      const a = db.get(id).a; const mid = a[3] && a[3].r; if (!mid) continue;
      const props = {};
      for (const pr of a[2] || []) { const pe = db.get(pr); if (pe && pe.t === 'IFCPROPERTYSINGLEVALUE') props[String(pe.a[0]).toLowerCase()] = numVal(pe.a[2]); }
      matProps.set(mid, Object.assign(matProps.get(mid) || {}, props));
    }
    for (const id of db.ids('IFCMECHANICALSTEELMATERIALPROPERTIES')) {
      const a = db.get(id).a; const mid = a[0] && a[0].r; if (!mid) continue;
      // Material, DynamicViscosity, YoungModulus, ShearModulus, PoissonRatio, ThermalExpansionCoefficient, YieldStress, UltimateStress
      matProps.set(mid, Object.assign(matProps.get(mid) || {}, { youngmodulus: numVal(a[2]), yieldstress: numVal(a[6]) }));
    }
    function numVal(v) { if (typeof v === 'number') return v; if (v && typeof v === 'object' && typeof v.v === 'number') return v.v; return null; }
    // property sets on products (for yield / grade strings)
    const psetOf = new Map();
    for (const id of db.ids('IFCRELDEFINESBYPROPERTIES')) {
      const a = db.get(id).a; const ps = db.get(a[5]); if (!ps || ps.t !== 'IFCPROPERTYSET') continue;
      const props = {};
      for (const pr of ps.a[4] || []) { const pe = db.get(pr); if (pe && pe.t === 'IFCPROPERTYSINGLEVALUE') { const v = pe.a[2]; props[String(pe.a[0]).toLowerCase()] = (v && typeof v === 'object' && 'v' in v) ? v.v : v; } }
      for (const o of a[4] || []) psetOf.set(o.r, Object.assign(psetOf.get(o.r) || {}, props));
    }

    /* ---- representation items → geometry primitives ---- */
    function itemGeom(ref, M, out, depth = 0) {
      if (depth > 12) return;
      const e = db.get(ref); if (!e) return;
      const a = e.a;
      switch (e.t) {
        case 'IFCEXTRUDEDAREASOLID': case 'IFCEXTRUDEDAREASOLIDTAPERED': {
          const Mi = mMul(M, a[1] ? axisPlacement(a[1]) : I3());
          const dirL = a[2] ? D(a[2]) : [0, 0, 1];
          const depthL = (a[3] || 0) * scale;
          out.push({ k: 'extrusion', M: Mi, dir: dirL, depth: depthL, profileRef: a[0] });
          break;
        }
        case 'IFCBOOLEANCLIPPINGRESULT': case 'IFCBOOLEANRESULT': itemGeom(a[1], M, out, depth + 1); break;
        case 'IFCMAPPEDITEM': {
          const src = db.get(a[0]); if (!src) break;
          const Mo = axisPlacement(src.a[0]);
          const Mt = cartesianOperator(a[1]);
          const M2 = mMul(mMul(M, Mt), Mo);
          const rep = db.get(src.a[1]);
          if (rep) for (const it of rep.a[3] || []) itemGeom(it, M2, out, depth + 1);
          break;
        }
        case 'IFCPOLYLINE': out.push({ k: 'polyline', pts: (a[0] || []).map(r => mApply(M, P(r))) }); break;
        case 'IFCINDEXEDPOLYCURVE': { const pl = db.get(a[0]); if (pl) out.push({ k: 'polyline', pts: (pl.a[0] || []).map(c => mApply(M, [c[0] * scale, c[1] * scale, (c[2] || 0) * scale])) }); break; }
        case 'IFCEDGE': case 'IFCORIENTEDEDGE': {
          const ed = e.t === 'IFCORIENTEDEDGE' ? db.get(a[2]) : e; if (!ed) break;
          const v0 = db.get(ed.a[0]), v1 = db.get(ed.a[1]);
          if (v0 && v1) out.push({ k: 'polyline', pts: [mApply(M, P(v0.a[0])), mApply(M, P(v1.a[0]))] });
          break;
        }
        case 'IFCSWEPTDISKSOLID': case 'IFCSWEPTDISKSOLIDPOLYGONAL': {
          const g = []; itemGeom(a[0], M, g, depth + 1);
          const R = (a[1] || 0) * scale, Ri = (a[2] || 0) * scale;
          for (const q of g) if (q.k === 'polyline') out.push({ k: 'polyline', pts: q.pts, disk: { D: 2 * R, t: Ri > 0 ? R - Ri : null } });
          break;
        }
        case 'IFCTRIANGULATEDFACESET': case 'IFCPOLYGONALFACESET': {
          const pl = db.get(a[0]); if (pl) out.push({ k: 'mesh', pts: (pl.a[0] || []).map(c => mApply(M, [c[0] * scale, c[1] * scale, (c[2] || 0) * scale])) });
          break;
        }
        case 'IFCFACETEDBREP': case 'IFCFACETEDBREPWITHVOIDS': case 'IFCADVANCEDBREP': {
          const shell = db.get(a[0]); const pts = [];
          if (shell) for (const f of shell.a[0] || []) faceEdgePts(f, M, pts);
          if (pts.length) out.push({ k: 'mesh', pts });
          break;
        }
        case 'IFCSHELLBASEDSURFACEMODEL': case 'IFCFACEBASEDSURFACEMODEL': {
          const pts = [];
          for (const sh of a[0] || []) { const s = db.get(sh); if (s) for (const f of s.a[0] || []) faceEdgePts(f, M, pts); }
          if (pts.length) out.push({ k: 'mesh', pts });
          break;
        }
        default: out.push({ k: 'unsupported', t: e.t });
      }
    }
    function faceEdgePts(fref, M, pts) {
      const f = db.get(fref); if (!f) return;
      for (const b of f.a[0] || []) {
        const be = db.get(b); if (!be) continue; const loop = db.get(be.a[0]);
        if (loop && loop.t === 'IFCPOLYLOOP') for (const r of loop.a[0] || []) pts.push(mApply(M, P(r)));
      }
    }
    function productGeometry(prod) {
      const M = objectPlacement(prod.a[5]);
      const pds = db.get(prod.a[6]);
      const res = { axis: [], body: [] };
      if (!pds) return res;
      for (const rr of pds.a[2] || []) {
        const rep = db.get(rr); if (!rep) continue;
        const ident = String(rep.a[1] || '').toUpperCase();
        const g = []; for (const it of rep.a[3] || []) itemGeom(it, M, g);
        if (ident === 'AXIS' || ident === 'REFERENCE') res.axis.push(...g); else if (ident === 'BODY' || ident === '' || ident === 'FACETATION') res.body.push(...g);
      }
      return res;
    }

    /* ---- grade → material ---- */
    function gradeInfo(name, extra) {
      const s = (String(name || '') + ' ' + String(extra || '')).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase();
      let kind = /CONC|BETON|C\d{2}\/\d{2}|STAHLBETON|HORMIGON|CALCESTRUZZO/.test(s) ? 'concrete' : /STEEL|STAHL|ACIER|S\s?\d{3}|A36|A572|A992|API|Q\d{3}|GR\.?\s?50/.test(s) ? 'steel' : /ALUM/.test(s) ? 'aluminium' : /TIMBER|WOOD|GL\d{2}/.test(s) ? 'timber' : 'unknown';
      let fy = null, grade = null, m;
      if ((m = s.match(/\bS\s?(235|275|355|420|460|500|550|690)\b/))) { fy = +m[1]; grade = 'S' + m[1]; kind = 'steel'; }
      else if (/A992/.test(s)) { fy = 345; grade = 'ASTM A992'; kind = 'steel'; }
      else if ((m = s.match(/A572.{0,6}(42|50|55|60|65)/))) { fy = Math.round(+m[1] * 6.895); grade = 'ASTM A572 Gr ' + m[1]; kind = 'steel'; }
      else if (/\bA36\b/.test(s)) { fy = 250; grade = 'ASTM A36'; kind = 'steel'; }
      else if ((m = s.match(/API\s?2(H|W|Y|MT1).{0,6}(42|50|60)/))) { fy = Math.round(+m[2] * 6.895); grade = 'API 2' + m[1] + ' ' + m[2]; kind = 'steel'; }
      else if ((m = s.match(/\bQ(235|345|355|390|420|460)\b/))) { fy = +m[1]; grade = 'Q' + m[1]; kind = 'steel'; }
      else if ((m = s.match(/\bC(\d{2})\/(\d{2})\b/))) { grade = 'C' + m[1] + '/' + m[2]; kind = 'concrete'; }
      else if (kind === 'steel' && (m = s.match(/\b(2[0-9]{2}|[3-6][0-9]{2})\s?MPA\b/))) { fy = +m[1]; grade = 'fy ' + m[1] + ' MPa (from name)'; }
      else if (kind === 'steel' && (m = s.match(/\b(3[0-9]|[4-9][0-9])\s?KSI\b/))) { fy = Math.round(+m[1] * 6.895); grade = m[1] + ' ksi (from name)'; }
      return { kind, fy, grade };
    }

    /* ---- walk products ---- */
    const members = [], plates = [], other = {};
    const allProducts = [];

/* ---------- resultant of an item (global vector, kN) ---------- */
function itemForce(it) {

function staadLoadsIn(txt) {
  const ld = { cases: [], combos: [], next: { lc: 1, cb: 101 } }; M.loads = ld; const pOff = M.beams.size ? Math.max(...M.beams.keys()) : 0;
  const lines = txt.replace(/-\s*\r?\n/g, ' ').split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  let cur = null, mode = null, combo = null;
  for (const raw of lines) {
    const l = raw.toUpperCase(); if (l.startsWith('*')) continue;
    let m;
    if ((m = l.match(/^LOAD\s+(\d+)(?:\s+LOADTYPE\s+(\w+))?(?:\s+TITLE\s+(.*))?$/))) { const ty = m[2] ? m[2][0] + m[2].slice(1).toLowerCase() : 'Other'; const t = LTYPES.find(x => x[0] === ty) || (ty === 'Environmental' ? ['Wave', 'E'] : ['Other', 'Q']); cur = { id: +m[1], title: m[3] || 'LOAD ' + m[1], type: t[0], cat: t[1], items: [] }; ld.cases.push(cur); ld.next.lc = Math.max(ld.next.lc, cur.id + 1); mode = null; combo = null; continue; }
    if ((m = l.match(/^LOAD COMB(?:INATION)?\s+(\d+)\s*(.*)$/))) { combo = { id: +m[1], title: m[2] || 'COMB ' + m[1], code: 'STAAD input', ref: '', f: [] }; ld.combos.push(combo); ld.next.cb = Math.max(ld.next.cb, combo.id + 1); cur = null; continue; }
    if (combo && /^[\d\s.\-E+]+$/.test(l)) { const t = l.split(/\s+/); for (let i = 0; i + 1 < t.length; i += 2) combo.f.push([+t[i], +t[i + 1]]); continue; }
    if (!cur) continue;
    if ((m = l.match(/^SELFWEIGHT\s+([XYZ])\s+([-\d.E+]+)/))) { cur.items.push({ k: 'sw', dir: m[1], f: +m[2] }); continue; }
    if (/^JOINT LOAD/.test(l)) { mode = 'j'; continue; } if (/^MEMBER LOAD/.test(l)) { mode = 'm'; continue; } if (/^ELEMENT LOAD/.test(l)) { mode = 'e'; continue; } if (/^TEMPERATURE LOAD/.test(l)) { mode = 't'; continue; }
    if (/^(PERFORM|FINISH|PRINT|PARAMETER)/.test(l)) { cur = null; mode = null; continue; }
    const tk = l.split(/\s+/); let k = 0; const ids = []; while (k < tk.length && (/^\d+$/.test(tk[k]) || tk[k] === 'TO' || tk[k] === 'BY')) ids.push(tk[k++]); const list = parseList(ids.join(' ')); const rest = tk.slice(k);
    if (mode === 'j') { const F = relZero(); for (let i = 0; i + 1 < rest.length; i += 2) { const di = DOF.indexOf(rest[i]); if (di >= 0) F[di] = +rest[i + 1]; } list.forEach(n => cur.items.push({ k: 'node', node: n, F: F.slice() })); }
    else if (mode === 'm' && (rest[0] === 'UNI' || rest[0] === 'UMOM') && rest[0] === 'UNI') list.forEach(b => cur.items.push({ k: 'uni', beam: b, dir: rest[1], w: +rest[2], d1: rest[3] != null ? +rest[3] : null, d2: rest[4] != null ? +rest[4] : null }));
    else if (mode === 'm' && rest[0] === 'CON') list.forEach(b => cur.items.push({ k: 'con', beam: b, dir: rest[1], P: +rest[2], d: +(rest[3] || 0) }));
    else if (mode === 'e' && rest[0] === 'PR') { const dir = /^G[XYZ]$/.test(rest[1]) ? rest[1] : 'LOCAL'; const p = +(dir === 'LOCAL' ? rest[1] : rest[2]); list.forEach(e => cur.items.push({ k: 'pr', plate: M.plates.has(e) ? e : e - pOff, dir, p })); }
    else if (mode === 't' && rest[0] === 'TEMP') list.forEach(b => cur.items.push({ k: 'temp', beam: b, dt: +rest[1] }));
  }
  S.lc = ld.cases.length ? ld.cases[0].id : null;
}

/* ---------- what is attached to a set of nodes ---------- */
function attachedTo(nds, explicit) {
  const beams = [...M.beams.values()].filter(b => !explicit.beams.has(b.id) && nds.has(b.i) && nds.has(b.j)).map(b => b.id);
  const plates = [...M.plates.values()].filter(p => !explicit.plates.has(p.id) && p.n.every(n => nds.has(n))).map(p => p.id);
  const solids = [...M.solids.values()].filter(s => !explicit.solids.has(s.id) && s.n.every(n => nds.has(n))).map(s => s.id);
  return { beams, plates, solids };
}
/* elements that lose a node if these nodes go */
function dependentOn(nds) {
  const beams = [...M.beams.values()].filter(b => nds.has(b.i) || nds.has(b.j)).map(b => b.id);
  const plates = [...M.plates.values()].filter(p => p.n.some(n => nds.has(n))).map(p => p.id);
  const solids = [...M.solids.values()].filter(s => s.n.some(n => nds.has(n))).map(s => s.id);

}
/* nodes left unused once these elements are removed */
function nodesFreedBy(beams, plates, solids) {
  const used = new Map();
  for (const b of M.beams.values()) { if (beams.has(b.id)) continue; used.set(b.i, 1); used.set(b.j, 1); }
  for (const p of M.plates.values()) { if (plates.has(p.id)) continue; p.n.forEach(n => used.set(n, 1)); }
  for (const s of M.solids.values()) { if (solids.has(s.id)) continue; s.n.forEach(n => used.set(n, 1)); }
  const touched = new Set();
  for (const id of beams) { const b = M.beams.get(id); if (b) { touched.add(b.i); touched.add(b.j); } }
  for (const id of plates) { const p = M.plates.get(id); if (p) p.n.forEach(n => touched.add(n)); }

}
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;

/* ================= COPY: respect what is actually selected ================= */
function doCopy(cut, withAttached) {

/* ================= DELETE: ask what else goes ================= */
function deleteScope(sc) {

  for (const id of sc.solids) M.solids.delete(id);

CMD.del = function () {

/* ================= EXACT PICKING (no magnetic snap) ================= */
S.pickTol = { node: 4, beam: 3 };
pickAt = function (x, y, kinds) {

  if (kinds.includes('beams')) { let best = null, bd = tb, bz = Infinity; for (const [id, [A, B]] of PROJ.beams) { const d = segD(x, y, A, B); if (d <= bd) { const z = (A[2] + B[2]) / 2; if (d < bd - 0.5 || z < bz) { bd = Math.min(bd, d); bz = z; best = id; } } } if (best) return { k: 'beams', id: best }; }

CMD.pickTol = () => formDlg('Cursor pick tolerance', [['n', 'Nodes (pixels)', 'number', S.pickTol.node], ['b', 'Beams and plates (pixels)', 'number', S.pickTol.beam]], v => { S.pickTol.node = Math.max(1, +v.n); S.pickTol.beam = Math.max(1, +v.b); toast(`Cursor must be within ${S.pickTol.node} px of a node, ${S.pickTol.beam} px of a beam.`); });

/* ================= 3D RENDER SCOPE ================= */

/* ================= JOINT HEALING ================= */
const HEAL_COLORS = { weld: '#FFD24D', level: '#FF9F43', split: '#4FC9D8', cross: '#A394FF', snap: '#FF6B4A', trim: '#E879F9' };
const HEAL_NAME = { weld: 'Welded coincident nodes', level: 'Levelled near-equal elevations', split: 'Split at a joint', cross: 'New node at a crossing', snap: 'End snapped onto a member', trim: 'Trimmed overlapping member' };
function markB(id, why) { const b = M.beams.get(id); if (b) { b.heal = b.heal || []; if (!b.heal.includes(why)) b.heal.push(why); } }
function markN(id, why) { const n = M.nodes.get(id); if (n) { n.heal = n.heal || []; if (!n.heal.includes(why)) n.heal.push(why); } }
function healModel(o) {
  const R = { weld: 0, zero: 0, dup: 0, level: 0, split: 0, cross: 0, snap: 0, trim: 0, notes: [] };
  const segP = (p, a, b) => { const ab = V.sub(b, a); const L2 = V.dot(ab, ab) || 1; const t = V.dot(V.sub(p, a), ab) / L2; const tc = Math.max(0, Math.min(1, t)); return { t, tc, q: V.add(a, V.mul(ab, tc)), d: V.len(V.sub(p, V.add(a, V.mul(ab, tc)))) }; };

  if (o.weld > 0) { const before = M.nodes.size; const moved = new Set(); for (const n of M.nodes.values()) moved.add(n.id); const r = mergeNodes(o.weld); R.weld = r.merged; R.zero = r.zero; R.dup = r.dup; void before; void moved; }

  /* 2. level near-equal elevations (minor elevation differences from BIM) */
  if (o.level > 0) {
    const k = M.up === 'Y' ? 'y' : 'z';
    const vals = [...M.nodes.values()].map(n => n[k]).sort((a, b) => a - b);
    const clusters = []; let cur = [vals[0]];
    for (let i = 1; i < vals.length; i++) { if (vals[i] - cur[cur.length - 1] <= o.level) cur.push(vals[i]); else { clusters.push(cur); cur = [vals[i]]; } }
    if (cur.length) clusters.push(cur);
    for (const c of clusters) {
      if (c.length < 2 || c[c.length - 1] - c[0] < 1e-9) continue;
      // representative = the most used value in the cluster, else the mean
      const count = new Map(); for (const v of c) count.set(v, (count.get(v) || 0) + 1);
      let rep = c[0], best = -1; for (const [v, n] of count) if (n > best) { best = n; rep = v; }
      for (const n of M.nodes.values()) if (n[k] !== rep && Math.abs(n[k] - rep) <= o.level && n[k] >= c[0] - 1e-9 && n[k] <= c[c.length - 1] + 1e-9) { n[k] = rep; markN(n.id, 'level'); R.level++; }
    }
    if (R.level) { nodeIndex = null; const r2 = mergeNodes(Math.max(o.weld, 1e-4)); R.weld += r2.merged; R.dup += r2.dup; R.zero += r2.zero; }

  if (o.split > 0) {

      const cs = Math.max(o.split * 4, 0.5); const cg = new Map();
      for (const n of M.nodes.values()) { const key = [n.x, n.y, n.z].map(v => Math.floor(v / cs)).join(','); (cg.get(key) || cg.set(key, []).get(key)).push(n.id); }
      for (const b of list) {

        const a = nodeP(b.i), c = nodeP(b.j); const on = []; const seen = new Set();
        const lo = [0, 1, 2].map(x => Math.floor((Math.min(a[x], c[x]) - o.split) / cs)), hi = [0, 1, 2].map(x => Math.floor((Math.max(a[x], c[x]) + o.split) / cs));
        if ((hi[0] - lo[0] + 1) * (hi[1] - lo[1] + 1) * (hi[2] - lo[2] + 1) > 60000) continue;
        for (let x = lo[0]; x <= hi[0]; x++) for (let y = lo[1]; y <= hi[1]; y++) for (let z = lo[2]; z <= hi[2]; z++) {

          for (const nid of arr) { if (nid === b.i || nid === b.j || seen.has(nid)) continue; seen.add(nid); const r = segP(nodeP(nid), a, c); if (r.d <= o.split && r.t > 1e-4 && r.t < 1 - 1e-4) on.push({ n: nid, t: r.t, d: r.d, q: r.q }); }
        }

  if (o.snap > 0) {
    const deg = new Map(); for (const b of M.beams.values()) { deg.set(b.i, (deg.get(b.i) || 0) + 1); deg.set(b.j, (deg.get(b.j) || 0) + 1); }
    const ends = [...M.nodes.keys()].filter(id => (deg.get(id) || 0) === 1);
    for (const nid of ends) {
      if (!M.nodes.has(nid)) continue;
      const p = nodeP(nid);
      const own = [...M.beams.values()].find(b => b.i === nid || b.j === nid); if (!own) continue;
      const far = nodeP(own.i === nid ? own.j : own.i); const axis = V.norm(V.sub(p, far)); // outward along its own length
      let best = null;
      // (a) an existing joint just ahead of the end
      for (const n2 of M.nodes.values()) {
        if (n2.id === nid) continue; const q = [n2.x, n2.y, n2.z]; const d = V.len(V.sub(q, p));
        if (!(d > 1e-9 && d <= o.snap)) continue;
        const along = Math.abs(V.dot(V.norm(V.sub(q, p)), axis)); if (along < 0.6) continue;

      }
      // (b) a member the end runs into
      for (const b of M.beams.values()) {
        if (b.i === nid || b.j === nid) continue;
        const r = segP(p, nodeP(b.i), nodeP(b.j));
        if (!(r.d <= o.snap && r.t > 1e-3 && r.t < 1 - 1e-3)) continue;
        // the end must be short of (or past) its target along its OWN axis, not pulled sideways onto a passing member
        const dir = V.len(V.sub(r.q, p)) > 1e-9 ? V.norm(V.sub(r.q, p)) : axis;
        const along = Math.abs(V.dot(dir, axis));

        const score = r.d / Math.pow(along, 4);   // strongly prefer the member the beam runs into, not one passing beside it
        if (!best || score < best.score) best = { b, ...r, score };
      }
      if (!best) continue;
      const n = M.nodes.get(nid); n.x = best.q[0]; n.y = best.q[1]; n.z = best.q[2]; nodeIndex = null;
      markN(nid, 'snap'); if (best.node) markN(best.node, 'snap');
      for (const bb of M.beams.values()) if (bb.i === nid || bb.j === nid) markB(bb.id, 'snap');
      if (best.b) { markB(best.b.id, 'snap'); const created = splitBeamAtPoints(best.b, [best.q]); (created || []).forEach(id => markB(id, 'snap')); }

    }

  }

  /* 5. crossing members with no shared node (X-braces) */
  if (o.cross > 0) {
    const list = [...M.beams.values()];
    const pts = [];
    for (let i = 0; i < list.length; i++) for (let j = i + 1; j < list.length; j++) {
      const A = list[i], B = list[j]; if (!M.beams.has(A.id) || !M.beams.has(B.id)) continue;
      if (A.i === B.i || A.i === B.j || A.j === B.i || A.j === B.j) continue;
      const c = closestSeg(nodeP(A.i), nodeP(A.j), nodeP(B.i), nodeP(B.j));
      if (c.d <= o.cross && c.s > 1e-3 && c.s < 1 - 1e-3 && c.t > 1e-3 && c.t < 1 - 1e-3) pts.push(V.mul(V.add(c.p, c.q), 0.5));
    }
    for (const p of pts) { const id = addNode(p[0], p[1], p[2]); markN(id, 'cross'); R.cross++; }
    if (pts.length) { const o2 = Object.assign({}, o, { snap: 0, cross: 0, level: 0, weld: 0, split: Math.max(o.split, o.cross) }); const r = healModel(o2); R.split += r.split; }
  }

  /* 6. overlapping collinear members */

    const used = new Map(); for (const b of M.beams.values()) used.set(b.type, (used.get(b.type) || 0) + 1);
    const NAME = { normal: 'Normal', truss: 'Truss', tension: 'Tension only', compression: 'Compression only', cable: 'Cable', inactive: 'Inactive', rigid: 'Rigid link' };
    const COL = { normal: cssv('--beam'), truss: '#F28C38', tension: '#22D3EE', compression: '#E879F9', cable: '#FACC15', inactive: cssv('--link'), rigid: cssv('--link') };
    for (const [k, n] of used) out.push([COL[k] || cssv('--beam'), `${NAME[k] || k} (${n})`]);
  } else if (S.color === 'status') {
    let ok = 0, bad = 0; for (const b of M.beams.values()) (b.sec && b.mat ? ok++ : bad++);
    for (const p of M.plates.values()) (p.t && p.mat ? ok++ : bad++);
    out.push([cssv('--ok'), `Ready for analysis (${ok})`]);
    if (bad) out.push([cssv('--bad'), `Missing section, material or thickness (${bad})`]);
  } else if (S.color === 'healed') {
    const used = new Map();
    for (const b of M.beams.values()) (b.heal || []).forEach(h => used.set(h, (used.get(h) || 0) + 1));
    for (const p of M.plates.values()) (p.heal || []).forEach(h => used.set(h, (used.get(h) || 0) + 1));
    for (const n of M.nodes.values()) (n.heal || []).forEach(h => used.set(h, (used.get(h) || 0) + 1));
    for (const [h, n] of used) out.push([HEAL_COLORS[h], `${HEAL_NAME[h]} (${n})`]);
    if (!out.length) out.push([cssv('--link'), 'Nothing was healed']);
    else out.push([cssv('--link'), 'Unchanged']);
  }
  return out;
}

/* GeoSoft Structural Modeller — part 11: self-weight calculator
   Material take-off, total weight, and support reactions from a linear static
   3D frame solve of self-weight alone. This is the first piece of step 3. */

const G_ACC = 9.80665;

/* ---------- material take-off ---------- */
function buildMTO() {
  const rows = new Map();
  let steel = 0, other = 0, missing = 0;
  for (const b of M.beams.values()) {
    if (b.type === 'rigid' || b.type === 'inactive') continue;
    const s = M.sections.get(b.sec), m = M.materials.get(b.mat);
    const L = beamLen(b);
    const key = (s ? s.name : 'NO SECTION') + ' | ' + (m ? m.name : 'NO MATERIAL');
    let r = rows.get(key);
    if (!r) { r = { kind: 'Member', sec: s ? s.name : null, mat: m ? m.name : null, n: 0, L: 0, upm: s && s.props && m ? s.props.A * m.rho : null, mass: 0 }; rows.set(key, r); }
    r.n++; r.L += L;
    if (r.upm != null) { const w = r.upm * L; r.mass += w; if (m && m.kind === 'steel') steel += w; else other += w; }
    else missing++;
  }
  for (const p of M.plates.values()) {
    const m = M.materials.get(p.mat);
    const A = plateArea(p);
    const key = 'PLATE t=' + (p.t ? fx(p.t * 1000, 1) + 'mm' : '?') + ' | ' + (m ? m.name : 'NO MATERIAL');
    let r = rows.get(key);
    if (!r) { r = { kind: 'Plate', sec: p.t ? `${fx(p.t * 1000, 1)} mm plate` : 'plate, no thickness', mat: m ? m.name : null, n: 0, area: 0, upm: p.t && m ? p.t * m.rho : null, mass: 0 }; rows.set(key, r); }
    r.n++; r.area = (r.area || 0) + A;
    if (r.upm != null) { const w = r.upm * A; r.mass += w; if (m && m.kind === 'steel') steel += w; else other += w; }
    else missing++;
  }
  const list = [...rows.values()].sort((a, b) => b.mass - a.mass);
  return { list, steel, other, total: steel + other, missing };
}

/* ---------- 3D frame solver, self-weight only ---------- */
function solveSelfWeight() {
  const up = M.up === 'Y' ? 1 : 2;
  const nodes = [...M.nodes.values()];
  const idx = new Map(nodes.map((n, k) => [n.id, k]));
  const nd = nodes.length, ndof = nd * 6;
  if (!nd) return { error: 'The model is empty.' };
  if (ndof > 2400) return { error: `Too large for the demo solver: ${nd} nodes (${ndof} degrees of freedom). The limit is 400 nodes until the step 3 solver uses a sparse method.` };
  const K = new Float64Array(ndof * ndof), F = new Float64Array(ndof);
  const at = (i, j) => i * ndof + j;
  const skipped = [];
  let Wtot = 0;

  const elems = [];
  for (const b of M.beams.values()) {
    if (b.type === 'inactive') continue;
    const s = M.sections.get(b.sec), m = M.materials.get(b.mat);
    const [pa, pc] = beamEnds(b);
    const L = V.len(V.sub(pc, pa));
    if (L < 1e-6) continue;
    if (!s || !s.props || !m || !m.E) { skipped.push(b.id); continue; }
    const P = s.props, E = m.E, Gm = m.G || E / 2.6;
    const A = P.A, Iz = P.I1, Iy = P.I2, J = P.J || (P.I1 + P.I2);
    const ax = axesOf(pa, pc, b.beta);
    // local stiffness
    const k = new Float64Array(144), K12 = (i, j, v) => { k[i * 12 + j] = v; k[j * 12 + i] = v; };
    const EA = E * A / L, GJ = Gm * J / L;
    const z1 = 12 * E * Iz / L ** 3, z2 = 6 * E * Iz / L ** 2, z3 = 4 * E * Iz / L, z4 = 2 * E * Iz / L;
    const y1 = 12 * E * Iy / L ** 3, y2 = 6 * E * Iy / L ** 2, y3 = 4 * E * Iy / L, y4 = 2 * E * Iy / L;
    k[0] = EA; k[6 * 12 + 6] = EA; K12(0, 6, -EA);
    k[3 * 12 + 3] = GJ; k[9 * 12 + 9] = GJ; K12(3, 9, -GJ);
    k[1 * 12 + 1] = z1; k[7 * 12 + 7] = z1; K12(1, 7, -z1);
    k[5 * 12 + 5] = z3; k[11 * 12 + 11] = z3; K12(5, 11, z4);
    K12(1, 5, z2); K12(1, 11, z2); K12(7, 5, -z2); K12(7, 11, -z2);
    k[2 * 12 + 2] = y1; k[8 * 12 + 8] = y1; K12(2, 8, -y1);
    k[4 * 12 + 4] = y3; k[10 * 12 + 10] = y3; K12(4, 10, y4);
    K12(2, 4, -y2); K12(2, 10, -y2); K12(8, 4, y2); K12(8, 10, y2);
    // local -> global rotation (rows are local axes)
    const R = [ax.x, ax.y, ax.z];
    // rigid offsets: end displacement = node displacement + rotation x arm
    const arm = [b.off && b.off.s ? (b.off.local ? V.add(V.add(V.mul(ax.x, b.off.s[0]), V.mul(ax.y, b.off.s[1])), V.mul(ax.z, b.off.s[2])) : b.off.s) : [0, 0, 0],
      b.off && b.off.e ? (b.off.local ? V.add(V.add(V.mul(ax.x, b.off.e[0]), V.mul(ax.y, b.off.e[1])), V.mul(ax.z, b.off.e[2])) : b.off.e) : [0, 0, 0]];
    // T maps global node dof (12) -> local element dof (12)
    const T = new Float64Array(144);
    for (let e = 0; e < 2; e++) {
      const r = arm[e];
      // translation block: local_t = R * (I, -skew(r)) ; rotation block: local_r = R
      for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) {
        T[(e * 6 + i) * 12 + (e * 6 + j)] = R[i][j];
        T[(e * 6 + 3 + i) * 12 + (e * 6 + 3 + j)] = R[i][j];
        // -R * skew(r)  where skew(r)*v = r x v
        const Sk = [[0, -r[2], r[1]], [r[2], 0, -r[0]], [-r[1], r[0], 0]];
        let v = 0; for (let q = 0; q < 3; q++) v += R[i][q] * Sk[q][j];
        T[(e * 6 + i) * 12 + (e * 6 + 3 + j)] = -v;
      }
    }
    // self-weight as a uniformly distributed global load
    const w = A * m.rho * G_ACC;                 // N/m
    Wtot += w * L;
    const gw = [0, 0, 0]; gw[up] = -w;
    const wl = [V.dot(gw, ax.x), V.dot(gw, ax.y), V.dot(gw, ax.z)];
    const fl = new Float64Array(12);
    fl[0] = wl[0] * L / 2; fl[6] = wl[0] * L / 2;
    fl[1] = wl[1] * L / 2; fl[7] = wl[1] * L / 2; fl[5] = wl[1] * L * L / 12; fl[11] = -wl[1] * L * L / 12;
    fl[2] = wl[2] * L / 2; fl[8] = wl[2] * L / 2; fl[4] = -wl[2] * L * L / 12; fl[10] = wl[2] * L * L / 12;
    // kg = T' k T, fg = T' fl
    const kT = new Float64Array(144);
    for (let i = 0; i < 12; i++) for (let j = 0; j < 12; j++) { let v = 0; for (let q = 0; q < 12; q++) v += k[i * 12 + q] * T[q * 12 + j]; kT[i * 12 + j] = v; }
    const kg = new Float64Array(144);
    for (let i = 0; i < 12; i++) for (let j = 0; j < 12; j++) { let v = 0; for (let q = 0; q < 12; q++) v += T[q * 12 + i] * kT[q * 12 + j]; kg[i * 12 + j] = v; }
    const fg = new Float64Array(12);
    for (let i = 0; i < 12; i++) { let v = 0; for (let q = 0; q < 12; q++) v += T[q * 12 + i] * fl[q]; fg[i] = v; }
    const gi = idx.get(b.i) * 6, gj = idx.get(b.j) * 6;
    const map = []; for (let q = 0; q < 6; q++) map.push(gi + q); for (let q = 0; q < 6; q++) map.push(gj + q);
    for (let i = 0; i < 12; i++) { F[map[i]] += fg[i]; for (let j = 0; j < 12; j++) K[at(map[i], map[j])] += kg[i * 12 + j]; }
    elems.push({ b, L, k, T, fl, map, ax });
  }
  // plates: weight lumped at their corner nodes (no shell stiffness in this demo)
  let Wplate = 0;
  for (const p of M.plates.values()) {
    const m = M.materials.get(p.mat); if (!p.t || !m) { skipped.push('P' + p.id); continue; }
    const W = plateArea(p) * p.t * m.rho * G_ACC; Wplate += W; Wtot += W;
    const share = W / p.n.length;
    for (const n of p.n) { const g = idx.get(n); if (g != null) F[g * 6 + up] -= share; }
  }

  /* supports */
  const fixed = new Uint8Array(ndof);
  let nsup = 0;
  for (const [nid, sp] of M.supports) {
    const g = idx.get(nid); if (g == null) continue; nsup++;
    for (let q = 0; q < 6; q++) {
      let hold = false;
      if (sp.type === 'fixed') hold = true;
      else if (sp.type === 'pinned') hold = q < 3;
      else if (sp.type === 'fixedbut' || sp.type === 'inclined') hold = !(sp.rel && sp.rel[q]);
      else if (sp.type === 'enforced') hold = !(sp.rel && sp.rel[q]);
      else if (sp.type === 'spring' || sp.type === 'tcspring') hold = false;
      else hold = true;
      if (sp.k && sp.k[q] > 0) { K[at(g * 6 + q, g * 6 + q)] += sp.k[q] * 1000; hold = false; }
      if (hold) fixed[g * 6 + q] = 1;
    }
  }
  if (!nsup) return { error: 'No supports: reactions cannot be calculated. Assign supports first.' };

  /* free DOFs, with unused rotational DOFs pinned to keep the matrix non-singular */
  const free = [];
  for (let i = 0; i < ndof; i++) {
    if (fixed[i]) continue;
    if (Math.abs(K[at(i, i)]) < 1e-6) { fixed[i] = 2; continue; }   // nothing attached to this DOF
    free.push(i);
  }
  const nf = free.length;
  const pos = new Int32Array(ndof).fill(-1); free.forEach((g, k) => { pos[g] = k; });
  const A2 = new Float64Array(nf * nf), bvec = new Float64Array(nf);
  for (let a = 0; a < nf; a++) { bvec[a] = F[free[a]]; for (let bq = 0; bq < nf; bq++) A2[a * nf + bq] = K[at(free[a], free[bq])]; }
  /* Gaussian elimination with partial pivoting */
  let scale = 0; for (let a = 0; a < nf; a++) scale = Math.max(scale, Math.abs(A2[a * nf + a]));
  const held = [];
  for (let c = 0; c < nf; c++) {
    let piv = c, mx = Math.abs(A2[c * nf + c]);
    for (let r = c + 1; r < nf; r++) { const v = Math.abs(A2[r * nf + c]); if (v > mx) { mx = v; piv = r; } }
    if (mx < scale * 1e-10) {
      // a zero-energy mode, usually a free rotation about a member axis. Hold it and carry on
      // rather than failing, and report how many were held.
      held.push(free[c]);
      for (let q = 0; q < nf; q++) { A2[c * nf + q] = 0; A2[q * nf + c] = 0; }
      A2[c * nf + c] = scale; bvec[c] = 0; continue;
    }
    if (piv !== c) { for (let q = 0; q < nf; q++) { const tmp = A2[c * nf + q]; A2[c * nf + q] = A2[piv * nf + q]; A2[piv * nf + q] = tmp; } const tb = bvec[c]; bvec[c] = bvec[piv]; bvec[piv] = tb; }
    const d = A2[c * nf + c];
    for (let r = c + 1; r < nf; r++) {
      const f = A2[r * nf + c] / d; if (!f) continue;
      for (let q = c; q < nf; q++) A2[r * nf + q] -= f * A2[c * nf + q];
      bvec[r] -= f * bvec[c];
    }
  }
  const x = new Float64Array(nf);
  for (let r = nf - 1; r >= 0; r--) { let s = bvec[r]; for (let q = r + 1; q < nf; q++) s -= A2[r * nf + q] * x[q]; x[r] = s / A2[r * nf + r]; }
  const U = new Float64Array(ndof);
  free.forEach((g, k) => { U[g] = x[k]; });

  /* reactions: R = K u - F at held DOFs */
  const react = new Map();
  for (const [nid] of M.supports) {
    const g = idx.get(nid); if (g == null) continue;
    const r = [0, 0, 0, 0, 0, 0];
    for (let q = 0; q < 6; q++) {
      const row = g * 6 + q;
      if (!fixed[row]) { const sp = M.supports.get(nid); r[q] = sp.k && sp.k[q] > 0 ? -sp.k[q] * 1000 * U[row] : 0; continue; }
      let s = 0; for (let j = 0; j < ndof; j++) if (U[j]) s += K[at(row, j)] * U[j];
      r[q] = s - F[row];
    }
    react.set(nid, r);
  }
  /* max displacement */
  let dmax = 0, dnode = null;
  for (let n = 0; n < nd; n++) { const d = Math.hypot(U[n * 6], U[n * 6 + 1], U[n * 6 + 2]); if (d > dmax) { dmax = d; dnode = nodes[n].id; } }
  const sum = [0, 0, 0];
  for (const r of react.values()) for (let q = 0; q < 3; q++) sum[q] += r[q];
  return { react, sum, Wtot, Wplate, skipped, dmax, dnode, up, nf, nsup, held: held.length };
}

/* ---------- report ---------- */
function selfWeightReport() {
  if (!M.beams.size && !M.plates.size) { toast('Nothing to weigh: the model is empty.'); return; }
  const mto = buildMTO();
  const t0 = performance.now();
  const S0 = solveSelfWeight();
  const ms = performance.now() - t0;
  const fW = v => `${fx(v * G_ACC / 1000, 1)} kN`;   // take-off is in kg; show the force it causes
  const tonne = v => `${fx(v / 1000, 2)} t`;
  const rows = mto.list.map(r => `<tr><td>${esc(r.sec || '—')}</td><td>${esc(r.mat || '<span class="chip bad">none</span>')}</td><td class="n">${r.n}</td><td class="n">${r.L != null ? fx(toU(r.L), 2) : fx(r.area, 2)}</td><td class="n">${r.upm != null ? fx(r.kind === 'Plate' ? r.upm : r.upm, 1) : '—'}</td><td class="n">${r.mass ? fx(r.mass / 1000, 3) : '<span class="chip bad">—</span>'}</td></tr>`).join('');
  let body = `<h3>Material take-off</h3>
    <div class="tblw" style="max-height:230px"><table><thead><tr><th>Section / plate</th><th>Material</th><th>No.</th><th>Length ${uL()} / area m²</th><th>kg per m / m²</th><th>Mass, t</th></tr></thead><tbody>${rows}</tbody></table></div>
    <dl class="kv" style="margin-top:8px">
      <dt>Steel</dt><dd class="mono">${tonne(mto.steel)} &nbsp; (${fW(mto.steel)})</dd>
      ${mto.other ? `<dt>Other materials</dt><dd class="mono">${tonne(mto.other)}</dd>` : ''}
      <dt><b>Total modelled weight</b></dt><dd class="mono"><b>${tonne(mto.total)} &nbsp; (${fW(mto.total)})</b></dd>
      ${mto.missing ? `<dt>Not weighed</dt><dd class="mono"><span class="chip bad">${mto.missing}</span> items without a section, thickness or material</dd>` : ''}
    </dl>`;
  if (S0.error) {
    body += `<h3 style="margin-top:12px">Support reactions</h3><p><span class="chip bad">not calculated</span> ${esc(S0.error)}</p>`;
  } else {
    const upName = ['X', 'Y', 'Z'][S0.up];
    const rr = [...S0.react.entries()].sort((a, b) => a[0] - b[0]).map(([nid, r]) => {
      const n = M.nodes.get(nid);
      return `<tr data-row="nodes:${nid}"><td class="n">${nid}</td><td class="n">${fx(toU(n.x), 2)}</td><td class="n">${fx(toU(n.y), 2)}</td><td class="n">${fx(toU(n.z), 2)}</td><td class="n">${fx(r[0] / 1000, 2)}</td><td class="n">${fx(r[1] / 1000, 2)}</td><td class="n">${fx(r[2] / 1000, 2)}</td><td class="n">${fx(r[3] / 1000, 2)}</td><td class="n">${fx(r[4] / 1000, 2)}</td><td class="n">${fx(r[5] / 1000, 2)}</td></tr>`;
    }).join('');
    const applied = mto.total * G_ACC;            // kg -> N
    const vert = S0.sum[S0.up], err = Math.abs(vert - applied) / (applied || 1) * 100;
    body += `<h3 style="margin-top:12px">Support reactions from self-weight</h3>
      <div class="tblw" style="max-height:230px"><table><thead><tr><th>Node</th><th>X</th><th>Y</th><th>Z</th><th>FX kN</th><th>FY kN</th><th>FZ kN</th><th>MX kNm</th><th>MY kNm</th><th>MZ kNm</th></tr></thead><tbody>${rr}</tbody></table></div>
      <dl class="kv" style="margin-top:8px">
        <dt>Σ vertical reaction (${upName})</dt><dd class="mono">${fx(vert / 1000, 1)} kN</dd>
        <dt>Total weight applied</dt><dd class="mono">${fx(applied / 1000, 1)} kN</dd>
        <dt>Equilibrium check</dt><dd class="mono">${err < 0.5 ? `<span class="chip ok">${fx(err, 3)}% out</span>` : `<span class="chip bad">${fx(err, 2)}% out</span>`}</dd>
        <dt>Σ horizontal</dt><dd class="mono">${fx(Math.hypot(...S0.sum.filter((_, k) => k !== S0.up)) / 1000, 3)} kN</dd>
        <dt>Largest deflection</dt><dd class="mono">${fx(S0.dmax * 1000, 2)} mm at node ${S0.dnode}</dd>
        <dt>Solved</dt><dd class="mono">${S0.nf} free DOF, ${S0.nsup} supports, ${fx(ms, 0)} ms</dd>
        ${S0.held ? `<dt>Held to stabilise</dt><dd class="mono"><span class="chip est">${S0.held}</span> free rotations with no stiffness</dd>` : ''}
      </dl>
      ${S0.skipped.length ? `<p class="note"><span class="chip bad">${S0.skipped.length}</span> members or plates were left out of the solve because they have no section, thickness or material. Their weight is not in the reactions.</p>` : ''}
      <p class="note">Linear static analysis of self-weight only, with rigid offsets included. Member releases are not yet applied, plate weight is lumped at the corner nodes and plates carry no stiffness, so the distribution between supports is approximate where plates are structural. The equilibrium check above shows the total is right.</p>`;
  }
  openDlg('Self-weight and material take-off', body, [['Close', () => true], ['Save CSV', () => { saveFile((M.name || 'model').replace(/\.[^.]+$/, '') + '_selfweight.csv', selfWeightCsv(mto, S0)); return false; }, false], ['Make it a load case', () => {
    mutate('Self-weight load case', () => { const c = newCase('Self-weight', 'Dead'); c.items.push({ k: 'sw', dir: M.up, f: -1 }); });
    S.tab = 'loading'; renderRibbonTabs(); renderRibbon(); S.ptab = 'loads'; refreshPanel();
  }, true]]);
  setTimeout(() => { $$('#dlgBody tr[data-row]').forEach(tr => tr.addEventListener('click', () => { const id = +tr.dataset.row.split(':')[1]; clearSel(); S.sel.nodes.add(id); afterSel(); })); }, 20);
}
function selfWeightCsv(mto, S0) {
  const L = [['GeoSoft self-weight report', M.name || ''], [], ['MATERIAL TAKE-OFF'], ['section_or_plate', 'material', 'count', 'length_m_or_area_m2', 'kg_per_m_or_m2', 'mass_kg']];
  for (const r of mto.list) L.push([r.sec || '', r.mat || '', r.n, (r.L != null ? r.L : r.area).toFixed(3), r.upm != null ? r.upm.toFixed(2) : '', r.mass ? r.mass.toFixed(1) : '']);
  L.push([], ['steel_kg', mto.steel.toFixed(1)], ['other_kg', mto.other.toFixed(1)], ['total_kg', mto.total.toFixed(1)], ['total_kN', (mto.total * G_ACC / 1000).toFixed(2)]);
  if (!S0.error) {
    L.push([], ['SUPPORT REACTIONS FROM SELF-WEIGHT (kN, kNm)'], ['node', 'x_m', 'y_m', 'z_m', 'FX', 'FY', 'FZ', 'MX', 'MY', 'MZ']);
    for (const [nid, r] of [...S0.react.entries()].sort((a, b) => a[0] - b[0])) { const n = M.nodes.get(nid); L.push([nid, n.x.toFixed(3), n.y.toFixed(3), n.z.toFixed(3), ...r.map(v => (v / 1000).toFixed(3))]); }
    L.push([], ['sum_vertical_kN', (S0.sum[S0.up] / 1000).toFixed(3)], ['total_weight_kN', (mto.total * G_ACC / 1000).toFixed(3)]);

/* GeoSoft Structural Modeller — part 12: part-wise material take-off */

S.mto = { group: 'part', cut: true, allow: 3, cont: 0, round: 0.01 };

/* ---------- classify a member into a part ---------- */
function partOf(b) {
  const a = nodeP(b.i), c = nodeP(b.j);
  const up = M.up === 'Y' ? 1 : 2;
  const d = V.sub(c, a); const L = V.len(d) || 1;
  const vert = Math.abs(d[up]) / L;
  const zTop = Math.max(a[up], c[up]), zBot = Math.min(a[up], c[up]);
  let top = -Infinity, bot = Infinity;
  for (const n of M.nodes.values()) { const z = [n.x, n.y, n.z][up]; top = Math.max(top, z); bot = Math.min(bot, z); }
  const h = top - bot || 1;
  const deckBand = top - 0.15 * h;
  const s = M.sections.get(b.sec); const tub = s && s.def && (s.def.shape === 'CHS' || s.def.shape === 'CIRC');
  if (b.type === 'rigid') return 'Rigid links';
  if (vert > 0.95) return zTop > deckBand && zBot > deckBand - 0.2 * h ? 'Deck legs and columns' : 'Legs';
  if (vert < 0.05) {
    if (zBot >= deckBand) return tub ? 'Deck framing (tubular)' : 'Deck framing';
    return Math.abs(zTop - bot) < 1e-6 ? 'Mudline framing' : 'Horizontal framing';
  }
  return zBot >= deckBand ? 'Deck bracing' : 'Diagonal bracing';
}
function levelOf(b) {
  const up = M.up === 'Y' ? 1 : 2;
  const z = (nodeP(b.i)[up] + nodeP(b.j)[up]) / 2;
  return 'EL ' + fx(toU(Math.round(z * 2) / 2), 2) + ' ' + uL();
}
function mtoGroupKey(b) {
  if (S.mto.group === 'part') return partOf(b);
  if (S.mto.group === 'role') return b.role || partOf(b);
  if (S.mto.group === 'level') return levelOf(b);
  if (S.mto.group === 'material') { const m = M.materials.get(b.mat); return m ? m.name : 'No material'; }
  if (S.mto.group === 'section') { const s = M.sections.get(b.sec); return s ? s.name : 'No section'; }
  return 'All';
}

/* ---------- build the take-off ---------- */
function buildPartMTO() {
  const groups = new Map();
  const add = (g, key, row) => { let G0 = groups.get(g); if (!G0) { G0 = { name: g, rows: new Map(), mass: 0, len: 0, area: 0, n: 0 }; groups.set(g, G0); } let r = G0.rows.get(key); if (!r) { r = row; G0.rows.set(key, r); } return r; };
  for (const b of M.beams.values()) {
    if (b.type === 'inactive') continue;
    const s = M.sections.get(b.sec), m = M.materials.get(b.mat);
    const L = beamLen(b);
    const Lr = Math.round(L / S.mto.round) * S.mto.round;
    const g = mtoGroupKey(b);
    const upm = s && s.props && m ? s.props.A * m.rho : null;
    const key = (s ? s.name : 'NO SECTION') + '|' + (m ? m.name : 'NO MATERIAL') + '|' + (S.mto.cut ? Lr.toFixed(3) : '');
    const r = add(g, key, { desc: s ? s.name : 'No section', grade: m ? (m.grade || m.name) : null, each: S.mto.cut ? Lr : null, qty: 0, len: 0, upm, mass: 0, ids: [] });
    r.qty++; r.len += L; r.ids.push(b.id); if (upm != null) r.mass += upm * L;
    const G0 = groups.get(g); G0.n++; G0.len += L; if (upm != null) G0.mass += upm * L;
  }
  for (const p of M.plates.values()) {
    const m = M.materials.get(p.mat); const A = plateArea(p);
    const g = S.mto.group === 'material' ? (m ? m.name : 'No material') : 'Plates and decking';
    const upm = p.t && m ? p.t * m.rho : null;
    const key = 'PL' + (p.t ? fx(p.t * 1000, 1) : '?') + '|' + (m ? m.name : '-');
    const r = add(g, key, { desc: p.t ? `Plate ${fx(p.t * 1000, 1)} mm` : 'Plate, no thickness', grade: m ? (m.grade || m.name) : null, each: null, qty: 0, area: 0, upm, mass: 0, plate: true, ids: [] });
    r.qty++; r.area = (r.area || 0) + A; r.ids.push(p.id); if (upm != null) r.mass += upm * A;
    const G0 = groups.get(g); G0.n++; G0.area += A; if (upm != null) G0.mass += upm * A;
  }
  const list = [...groups.values()].sort((a, b) => b.mass - a.mass);
  for (const g of list) g.list = [...g.rows.values()].sort((a, b) => (a.desc === b.desc ? (a.each || 0) - (b.each || 0) : b.mass - a.mass));
  const net = list.reduce((s, g) => s + g.mass, 0);
  const missing = list.reduce((s, g) => s + g.list.filter(r => r.upm == null).reduce((x, r) => x + r.qty, 0), 0);
  return { list, net, missing };
}

/* ---------- report ---------- */
function mtoDialog() {

  const render = () => {
    const D = buildPartMTO();

    const gross = D.net + allow + cont;
    let item = 0;
    const body = D.list.map(g => {
      const rows = g.list.map(r => {
        item++;
        return `<tr data-ids="${r.plate ? 'p' : 'b'}:${r.ids.join(',')}"><td class="n">${item}</td><td>${esc(r.desc)}</td><td>${esc(r.grade || '—')}</td><td class="n">${r.qty}</td>` +
          `<td class="n">${r.plate ? '—' : (r.each != null ? fx(toU(r.each), 3) : '—')}</td>` +
          `<td class="n">${r.plate ? fx(r.area, 2) + ' m²' : fx(toU(r.len), 2)}</td>` +
          `<td class="n">${r.upm != null ? fx(r.upm, 1) : '—'}</td>` +
          `<td class="n">${r.mass ? fx(r.mass, 0) : '<span class="chip bad">—</span>'}</td></tr>`;
      }).join('');
      return `<tr class="grp"><td colspan="8" style="background:var(--surface-2);font-weight:600;padding:5px 7px">${esc(g.name)}</td></tr>${rows}` +
        `<tr><td></td><td colspan="4" style="text-align:right;color:var(--muted)">Subtotal ${esc(g.name)}</td><td class="n">${g.area ? fx(g.area, 2) + ' m²' : fx(toU(g.len), 2)}</td><td></td><td class="n"><b>${fx(g.mass, 0)}</b></td></tr>`;
    }).join('');
    return `<div class="row" style="margin-bottom:8px">
      <label class="muted">Group by <select id="mG">${[['part', 'Part of structure'], ['level', 'Elevation'], ['section', 'Section'], ['material', 'Material'], ['role', 'Role']].map(o => `<option value="${o[0]}" ${S.mto.group === o[0] ? 'selected' : ''}>${o[1]}</option>`).join('')}</select></label>
      <label class="muted"><input type="checkbox" id="mCut" ${S.mto.cut ? 'checked' : ''}> Cut list (split by length)</label>
      <label class="muted">Allowance % <input type="number" id="mA" value="${S.mto.allow}" step="0.5" style="width:62px"></label>
      <label class="muted">Contingency % <input type="number" id="mC" value="${S.mto.cont}" step="0.5" style="width:62px"></label></div>
    <div class="tblw" style="max-height:380px"><table><thead><tr><th>Item</th><th>Description</th><th>Grade</th><th>Qty</th><th>Length each ${uL()}</th><th>Total length ${uL()} / area</th><th>kg/m or kg/m²</th><th>Mass kg</th></tr></thead><tbody>${body}</tbody></table></div>
    <dl class="kv" style="margin-top:8px">
      <dt>Net modelled weight</dt><dd class="mono">${fx(D.net / 1000, 2)} t &nbsp; (${fx(D.net * G_ACC / 1000, 1)} kN)</dd>
      <dt>Weld, fittings and coating allowance (${S.mto.allow}%)</dt><dd class="mono">${fx(allow / 1000, 2)} t</dd>
      <dt>Contingency (${S.mto.cont}%)</dt><dd class="mono">${fx(cont / 1000, 2)} t</dd>
      <dt><b>Gross weight</b></dt><dd class="mono"><b>${fx(gross / 1000, 2)} t &nbsp; (${fx(gross * G_ACC / 1000, 1)} kN)</b></dd>
      ${D.missing ? `<dt>Not weighed</dt><dd class="mono"><span class="chip bad">${D.missing}</span> items without section, thickness or material</dd>` : ''}
    </dl>
    <p class="note">Modelled steel only: joint cans, stiffeners, gussets, welds, anodes and coating are covered by the allowance, which you set. ISO 19901-5 keeps allowance and contingency separate, so they are shown separately here. Click any row to select those members in the model.</p>`;
  };
  const bind = () => {
    $('#mG').addEventListener('change', e => { S.mto.group = e.target.value; redraw(); });
    $('#mCut').addEventListener('change', e => { S.mto.cut = e.target.checked; redraw(); });
    $('#mA').addEventListener('change', e => { S.mto.allow = +e.target.value || 0; redraw(); });
    $('#mC').addEventListener('change', e => { S.mto.cont = +e.target.value || 0; redraw(); });
    $$('#dlgBody tr[data-ids]').forEach(tr => tr.addEventListener('click', () => {
      const [kind, ids] = tr.dataset.ids.split(':');
      clearSel(); ids.split(',').filter(Boolean).forEach(i => S.sel[kind === 'p' ? 'plates' : 'beams'].add(+i)); afterSel();
    }));
  };
  const redraw = () => { $('#dlgBody').innerHTML = render(); bind(); };
  openDlg('Material take-off', render(), [['Close', () => true], ['Save CSV', () => { saveFile((M.name || 'model').replace(/\.[^.]+$/, '') + '_MTO.csv', mtoCsv()); return false; }, false], ['Self-weight and reactions', () => { selfWeightReport(); }, true]]);
  bind();
}
function mtoCsv() {
  const D = buildPartMTO();
  const allow = D.net * S.mto.allow / 100, cont = (D.net + allow) * S.mto.cont / 100;
  const L = [['GeoSoft material take-off'], ['model', M.name || ''], ['date', new Date().toISOString().slice(0, 10)], ['grouped by', S.mto.group], ['units', 'm, kg'], [],
    ['item', 'group', 'description', 'grade', 'qty', 'length_each_m', 'total_length_m', 'area_m2', 'kg_per_unit', 'mass_kg']];
  let item = 0;
  for (const g of D.list) {
    for (const r of g.list) { item++; L.push([item, g.name, r.desc, r.grade || '', r.qty, r.each != null ? r.each.toFixed(3) : '', r.len ? r.len.toFixed(3) : '', r.area ? r.area.toFixed(3) : '', r.upm != null ? r.upm.toFixed(2) : '', r.mass ? r.mass.toFixed(1) : '']); }
    L.push(['', g.name + ' subtotal', '', '', g.n, '', g.len ? g.len.toFixed(3) : '', g.area ? g.area.toFixed(3) : '', '', g.mass.toFixed(1)]);
